<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />
  <title>CIDARANK — Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#fff;font-family:Arial,sans-serif;padding:24px}.card{max-width:460px;width:100%;border:1px solid #6f5516;border-radius:22px;padding:32px;text-align:center;background:#11161d}.logo{width:76px;height:76px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,#fff4b8,#d49b18 55%,#6d4800);display:grid;place-items:center;color:#111;font-size:38px;font-weight:900;box-shadow:0 0 26px rgba(212,155,24,.22)}h1{margin:0 0 10px}p{color:#b9c0ca;line-height:1.55;margin:0 0 20px}button{border:0;border-radius:13px;padding:13px 20px;font-weight:800;background:linear-gradient(90deg,#bd8412,#fff0a1);color:#111;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">◆</div>
    <h1>Você está sem internet</h1>
    <p>O CIDARANK precisa de conexão para carregar os dados mais recentes. Assim que a internet voltar, tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
